# compose-launcher config for RamenNoodles (https://github.com/Nate314/RamenNoodles)
# The launcher requires at least one port line, but this pipeline serves nothing.
# UNUSED_PORT only satisfies that rule: docker-compose.yml does not read it and publishes no ports.
port UNUSED_PORT 8080

url No web page: the container runs the pre-processing and the neural network once and exits.
url Output: .\run.ps1 logs pipeline   or   ./run.sh logs pipeline
